[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-assistant"
version = "0.1.0"
description = "MCP Integrated Terminal Assistant — offline AI-augmented CLI"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.2",
    "requests>=2.32",
    "psutil>=5.9",
]

[project.optional-dependencies]
tui = ["textual>=0.80", "rich"]
dev = ["pytest", "pytest-asyncio", "pytest-cov"]

[project.scripts]
mcp        = "mcp_assistant.main:main"
mcp-server = "mcp_assistant.server.app:_standalone"
mcp-eval   = "mcp_assistant.eval.harness:cli_main"
mcp-verify = "mcp_assistant.audit.logger:cli_verify"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_assistant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_classes = ["Test*"]
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]
